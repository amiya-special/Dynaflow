[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynaflow"
version = "0.2.0"
description = "DynaFlow framework for direct reasoning and agent workflows"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dynaflow = "dynaflow.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dynaflow = ["assets/*.json", "assets/*.txt"]

